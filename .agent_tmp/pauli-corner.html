<!DOCTYPE html><html><head><meta charset="utf-8">
<title>sigma with the left corner</title>
<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
<style>
  body{font-family:Georgia,serif;background:#fbfaf7;color:#1a1a1a;margin:0;padding:30px 36px;font-size:17px}
  h1{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#6b6459;margin:0 0 22px;font-weight:600}
  table{border-collapse:collapse;width:100%}
  th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#8a8378;text-align:left;font-weight:600;padding:0 12px 8px;border-bottom:1px solid #ddd7cb}
  td{padding:14px 12px;border-bottom:1px solid #e8e3d9;vertical-align:middle}
  td.f{font-size:40px;white-space:nowrap;width:46%}
  td.s{font-size:13px;font-family:ui-monospace,Menlo,monospace;color:#4a453d}
  td.n{font-size:12px;color:#8a8378;white-space:nowrap}
</style>
<script src="node_modules/katex/dist/katex.min.js"></script></head><body>
<h1>&sigma; with the corner U+231E</h1>
<table id="t">
<tr><th>rendered</th><th>source</th><th>note</th></tr>
</table>
<script>
const rows=[
 ["\\sigma_k","\\sigma_k","today"],
 ["\\sigma_k^{\\mathrm{pau}}","\\sigma_k^{\\mathrm{pau}}","the label alone"],
 ["\\sigma_k^{\\mathrm{pau}\u231E2}","\\sigma_k^{\\mathrm{pau}\\u231E 2}","label + corner + power"],
 ["\\sigma_k^{\\mathrm{pau}\u231Ei}","\\sigma_k^{\\mathrm{pau}\\u231E i}","general index"],
 ["\\sigma_k^{\\mathrm{pau}\u231E\\dagger}","\\sigma_k^{\\mathrm{pau}\\u231E\\dagger}","label + corner + dagger"],
 ["(\\sigma_k^{\\mathrm{pau}})^{2}","(\\sigma_k^{\\mathrm{pau}})^2","for comparison"],
 ["\\sigma_k^{\\mathrm{pau}2}","\\sigma_k^{\\mathrm{pau}2}","fused, the defect"]
];
const t=document.getElementById('t');
for(const [tex,src,note] of rows){
  const tr=document.createElement('tr');
  tr.innerHTML='<td class="f">'+katex.renderToString(tex,{throwOnError:false})+'</td>'
   +'<td class="s">'+src.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</td>'
   +'<td class="n">'+note+'</td>';
  t.appendChild(tr);
}
</script></body></html>
