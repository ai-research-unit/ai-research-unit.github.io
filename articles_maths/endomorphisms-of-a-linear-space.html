          crossorigin="anonymous"></script>
  <script>
    // KaTeX 0.16 has no character metrics for U+03DA (Ϛ), so \tilde is
    // positioned on the glyph instead of above it. A phantom height raises the
    // accent without changing the horizontal layout.
    function fixStigmaTilde() {
      var render = katex.render;
      if (render.stigmaFixed) return;
      katex.render = function (tex, el, opts) {
        if (typeof tex === 'string') {
          tex = tex.replace(/\\tilde\s*\{\s*Ϛ\s*\}/g, '\\tilde{\\text{Ϛ}\\vphantom{H}}');
        }
        return render.call(this, tex, el, opts);
      };
      katex.render.stigmaFixed = true;
    }
  </script>
  <script defer
          src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
          integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05"
          crossorigin="anonymous"
          onload="fixStigmaTilde(); renderMathInElement(document.body, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$',  right: '$',  display: false}
            ],
            macros: {
              '\\slashed': '\\not{#1}',
              /* Border-only boxes: KaTeX's \boxed expands through \fbox, so both names are defined here. */
              '\\boxed': '\\fcolorbox{black}{transparent}{$\\displaystyle #1$}',
              '\\fbox': '\\fcolorbox{black}{transparent}{$\\displaystyle #1$}'
            },
            throwOnError: false,
            errorColor: '#c00'
          });"></script>
